# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: mtls-with-apim-and-agw
metadata:
  template: mtls-with-apim-and-agw@1.0.3
infra:
  layers:
    - name: core
      path: ./infra/01-core
      hooks:
        postprovision:
          - shell: pwsh
            run: ./hooks/postprovision-create-agw-server-certificate.ps1
          - shell: pwsh
            run: ./hooks/postprovision-import-client-certificates.ps1
    - name: platform
      path: ./infra/02-platform
    - name: application
      path: ./infra/03-application
requiredVersions:
  azd: ">= 1.28.1" # azd version 1.28.1 or higher is required because we're using features from Bicep v0.45.6.
